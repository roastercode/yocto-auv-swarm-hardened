# poky-auv-hardened: poky-hardened (SELinux, no debug-tweaks, hashed
# root password, CVE analysis on every image) plus the AUV swarm needs.

require conf/distro/poky-hardened.conf

DISTRO = "poky-auv-hardened"
DISTRO_NAME = "Poky AUV Hardened"
DISTRO_VERSION = "0.2.0"

# ROS 2 middleware: Zenoh, never DDS. It runs inside each vehicle and
# over wide links only; acoustic links go through DTN. The ROS 2
# distribution (Jazzy, LTS) is selected by meta-ros2-jazzy in
# bblayers.conf.
AUV_RMW_IMPLEMENTATION ?= "rmw_zenoh_cpp"

# Zenoh version: rmw_zenoh (zenoh-cpp-vendor 0.2.10) is validated
# upstream against zenoh-c 1.8.0. meta-zenoh defaults to a newer one;
# zenohd follows the same version, so router and clients match.
ZENOH_VERSION = "1.8.0"
