# Observation sans instrumentation des verrous : ou le temps est passe a
# attendre, et si la machine sature.
CONFIG_BLK_DEV_IO_TRACE=y
CONFIG_TASK_DELAY_ACCT=y
CONFIG_TASKSTATS=y
# TASK_IO_ACCOUNTING depend de TASK_XACCT.
CONFIG_TASK_XACCT=y
CONFIG_TASK_IO_ACCOUNTING=y
CONFIG_PSI=y
# CONFIG_PSI_DEFAULT_DISABLED is not set
CONFIG_SCHEDSTATS=y
