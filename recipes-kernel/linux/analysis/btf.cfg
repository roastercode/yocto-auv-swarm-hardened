# BTF et points d'attache : ce dont bpftrace, bcc et bpftool ont besoin
# pour lire les structures du noyau sans en-tete ni reconstruction.
CONFIG_DEBUG_INFO_BTF=y
CONFIG_DEBUG_INFO_BTF_MODULES=y
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_EVENTS=y
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBES=y
CONFIG_UPROBE_EVENTS=y
CONFIG_PERF_EVENTS=y
# En-tetes du noyau exposes dans /sys/kernel/kheaders.tar.xz pour bcc.
CONFIG_IKHEADERS=m
