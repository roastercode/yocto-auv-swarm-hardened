# KCSAN : courses de donnees, les deux acces et les deux piles au moment
# ou ils se croisent. Machine a une fraction de sa vitesse.
# Investigation seulement. Active depuis l'espace utilisateur :
#   echo on > /sys/kernel/debug/kcsan
CONFIG_KCSAN=y
# CONFIG_KCSAN_EARLY_ENABLE is not set
# CONFIG_KCSAN_SELFTEST is not set
# CONFIG_KCSAN_KUNIT_TEST is not set
CONFIG_KCSAN_REPORT_VALUE_CHANGE_ONLY=y
CONFIG_KCSAN_ASSUME_PLAIN_WRITES_ATOMIC=y
CONFIG_KCSAN_REPORT_ONCE_IN_MS=0
CONFIG_KCSAN_VERBOSE=y
